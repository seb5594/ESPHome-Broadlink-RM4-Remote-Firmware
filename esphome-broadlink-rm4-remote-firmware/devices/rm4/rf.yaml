# 433 MHz radio of the Broadlink RM4 Pro. EXPERIMENTAL: the module answers and
# received frames are confirmed on a device, sending is not.
#
# pro.yaml includes this file, so there is nothing to add to your own config. It
# needs ESPHome 2026.10 or newer (the native radio_frequency entity below).
#
# The radio is the separate BL3361 module. The component `bl3361` of this
# repository handles both connections to it:
#
#   UART0    commands: tunes the module (frequency, receive/transmit switch,
#            signal strength). TX PA14, RX PA13, 115200 baud, 8 data bits, even
#            parity, 1 stop bit. The component opens the port itself, there is
#            no `uart:` section to write
#   data pin the raw data pin that carries the demodulated signal in and the
#            signal to transmit out
#
# Evidence (all of it read from the stock firmware dump, see
# docs/devices/rm4-pro.md for how):
#   - The hardware profile of the stock firmware lists `rf` = [9, 0, 90, 20]:
#     the last number is the data pin of the radio, 20 -> PA20. Phdindota's
#     notes name the same pin.
#   - The UART driver of the stock firmware opens port 0 with pins 14 (TX) and
#     13 (RX) and the format above, and the RF driver asks for port 0.
#
# What you get in Home Assistant (docs/433mhz.md has the details):
#   - RF Frequency (a choice) and RF Custom Frequency (any MHz): the frequency
#     of the radio, kept over restarts.
#   - RF Transmitter: the native radio_frequency entity, with which integrations
#     of Home Assistant send through the radio.
#   - Received 433 MHz codes as the event `esphome.<name>_rf_received`, with the
#     raw pulse timings in `code` and the frequency in `frequency_mhz`.
#   - Learning like the Broadlink app: the actions `rf_learn`, `rf_find_frequency`
#     and `rf_cancel`, with the progress as the event `esphome.<name>_rf_learn`.
#   - The actions `rf_send_raw`, `rf_send_raw_at`, `rf_set_frequency` and
#     `rf_scan`, and a relative signal strength sensor.

substitutions:
  # Where the external component is loaded from. Keep both in step with the
  # package reference of rm4-pro.example.yaml.
  firmware_url: https://github.com/seb5594/ESPHome-Broadlink-RM4-Remote-Firmware
  firmware_ref: main

  # Carrier frequency. 433.92 MHz is the usual one in Europe. The module tunes
  # to 305-340 MHz and 430-440 MHz.
  rf_frequency: 433.92MHz

  # Raw data pin of the radio, taken from the profile of the stock firmware.
  pin_rf_data: PA20

external_components:
  - source:
      type: git
      url: ${firmware_url}
      ref: ${firmware_ref}
      path: esphome-broadlink-rm4-remote-firmware/components
    components: [bl3361]
    refresh: 1d

bl3361:
  id: rf
  data_pin: ${pin_rf_data}
  frequency: ${rf_frequency}
  # The frequency as a choice in Home Assistant. The last one used is kept over
  # a restart, so `rf_frequency` only decides the very first start. "Custom"
  # shows up when the radio sits on a frequency that is not in the list, for
  # example after `rf_learn` found one. Add your own frequencies like this:
  #   options: [315MHz, 433.92MHz, 433.42MHz]
  frequency_select:
    name: RF Frequency
  # The same for any frequency in MHz, for one that is not in the list above.
  frequency_number:
    name: RF Custom Frequency
  # If a transmitter in reach produces no frames at all, but the log shows the
  # module answering, try inverting the data pin (the idle level is unknown):
  #   data_pin:
  #     number: ${pin_rf_data}
  #     inverted: true
  rssi:
    name: RF Signal Strength
    entity_category: diagnostic
  on_receive:
    - homeassistant.event:
        event: esphome.${name}_rf_received
        data:
          frequency_mhz: !lambda 'return str_sprintf("%.3f", id(rf).frequency_khz() / 1e3f);'
          pulses: !lambda "return to_string(x.size());"
          code: !lambda |-
            std::string text;
            for (size_t i = 0; i < x.size(); i++) {
              if (i != 0)
                text += ",";
              text += to_string(x[i]);
            }
            return text;
  # Steps of a frequency search or a learning session, see docs/433mhz.md. The
  # phases are sweep, found, capture, learned, timeout, cancelled and failed.
  on_learn:
    - homeassistant.event:
        event: esphome.${name}_rf_learn
        data:
          phase: !lambda "return phase;"
          frequency_mhz: !lambda 'return str_sprintf("%.3f", frequency_mhz);'
          repeats: !lambda "return to_string(repeats);"
          code: !lambda |-
            std::string text;
            for (size_t i = 0; i < code.size(); i++) {
              if (i != 0)
                text += ",";
              text += to_string(code[i]);
            }
            return text;

# The radio as the native Home Assistant entity for sub-GHz transmitters. Other
# integrations send through it; for your own codes the actions below do the same.
radio_frequency:
  - platform: bl3361
    name: RF Transmitter

api:
  homeassistant_services: true
  actions:
    # Sends a raw code as seen in the received event: positive numbers are the
    # signal on, negative ones off, both in microseconds.
    - action: rf_send_raw
      variables:
        code: int[]
        repeat: int
      then:
        - bl3361.send_raw:
            code: !lambda "return code;"
            repeat: !lambda "return repeat;"
    # The same on another frequency, for this code only. The radio goes back to
    # the selected frequency afterwards.
    - action: rf_send_raw_at
      variables:
        code: int[]
        repeat: int
        frequency_mhz: float
      then:
        - bl3361.send_raw:
            code: !lambda "return code;"
            repeat: !lambda "return repeat;"
            frequency: !lambda "return frequency_mhz * 1e6;"
    # Retunes the radio, e.g. 868 is not possible, 315.0 or 433.92 are.
    - action: rf_set_frequency
      variables:
        frequency_mhz: float
      then:
        - bl3361.set_frequency:
            frequency: !lambda "return frequency_mhz * 1e6;"
    # Searches both bands for a transmitter while you hold a key of the remote
    # and tunes the radio to it. The result comes as the event
    # esphome.<name>_rf_learn with the phases sweep and found.
    - action: rf_find_frequency
      then:
        - bl3361.find_frequency:
    # Like the learning of the original firmware: hold a key (the frequency is
    # searched), then press it briefly a few times (the code is captured). The
    # steps and the result come as the event esphome.<name>_rf_learn.
    - action: rf_learn
      then:
        - bl3361.learn:
    # Ends a search or learning session.
    - action: rf_cancel
      then:
        - bl3361.cancel:
    # Logs the signal strength on the channels around the frequency. Press a
    # remote while it runs to see which channel lights up.
    - action: rf_scan
      then:
        - bl3361.scan:
