# Feature: status LED and physical button.
#
# The device file hands over the pins as substitutions:
#   pin_status_led   LED pin, lit when the pin is low
#   pin_button       button pin, pressed when the pin is low

status_led:
  pin:
    number: ${pin_status_led}
    inverted: true

binary_sensor:
  - platform: gpio
    # Not just `button`: that name belongs to the ESPHome integration, and a
    # `button:` entity of your own would clash with it.
    id: device_button
    name: Button
    pin:
      number: ${pin_button}
      inverted: true
      mode: INPUT_PULLUP
