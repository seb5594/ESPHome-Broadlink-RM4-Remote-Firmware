# Home Assistant connection shared by all devices in this repository.
#
# Credentials and keys are not part of it, they belong into your own device
# config (see the *.example.yaml files in the repository root).
#
# Author:  seb5594 (Sebastian Schmidt) <seb5594@users.noreply.github.com>
# Project: https://github.com/seb5594/ESPHome-Broadlink-RM4-Remote-Firmware

substitutions:
  # Shown in the device info in Home Assistant, see `esphome.project`.
  project_version: "1.3.0"
  # ESPHome has no field for the author or the address of a project, so they are
  # kept here and show up as the comment of the device in the ESPHome dashboard.
  project_author: "seb5594 (Sebastian Schmidt) <seb5594@users.noreply.github.com>"
  project_url: https://github.com/seb5594/ESPHome-Broadlink-RM4-Remote-Firmware

esphome:
  comment: "Broadlink firmware by ${project_author}, ${project_url}"

api:

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  # Without a connection the device opens a fallback hotspot named after it.
  ap:

# Web page on the fallback hotspot to enter new Wi-Fi credentials, so a
# changed password never means opening the case again.
captive_portal:
