# Same as ci-rm4-mini.yaml, plus the MAC address package. The component is
# fetched from GitHub like a user's config would do it; CI passes the commit
# under test as `firmware_ref`. Not meant for flashing.

substitutions:
  name: ci-broadlink-rm4-mini-mac
  friendly_name: CI Broadlink RM4 Mini MAC
  mac_address: "02:00:00:00:00:01"

packages:
  broadlink_rm4_mini: !include ../../esphome-broadlink-rm4-remote-firmware/devices/rm4-mini/rm4-mini.yaml
  mac: !include ../../esphome-broadlink-rm4-remote-firmware/platform/rtl8720c/mac-address.yaml

wifi:
  ssid: ci-network
  password: ci-password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - id: !extend ota_esphome
    encryption:
