# The RM4 Pro as users get it: infrared and the 433 MHz radio. The radio
# component is fetched from GitHub like a user's config would do it; CI passes the
# commit under test as `firmware_ref`. Not meant for flashing.

substitutions:
  name: ci-broadlink-rm4-pro
  friendly_name: CI Broadlink RM4 Pro

packages:
  broadlink_rm4_pro: !include ../../esphome-broadlink-rm4-remote-firmware/devices/rm4/pro.yaml

wifi:
  ssid: ci-network
  password: ci-password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - id: !extend ota_esphome
    encryption:

# What users add to the radio: a lock and a button that send learned codes. A
# `button:` entity must not clash with the physical button of the package.
lock:
  - platform: template
    name: Car
    optimistic: true
    assumed_state: true
    lock_action:
      - bl3361.send_raw:
          frequency: 434.3MHz
          repeat: 8
          code: [300, -300, 600, -9000]
    unlock_action:
      - bl3361.send_raw:
          frequency: 434.3MHz
          repeat: 8
          code: [300, -300, 300, -600, 600, -9000]

button:
  - platform: template
    name: Trunk
    on_press:
      - bl3361.send_raw:
          frequency: 434.3MHz
          repeat: 8
          code: [600, -300, 300, -9000]
