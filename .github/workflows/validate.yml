name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The commit under test. Configs that load files from GitHub (the RF
  # component, remote packages) must point at it, not at a moving branch.
  FIRMWARE_URL: ${{ github.server_url }}/${{ github.repository }}
  FIRMWARE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install yamllint
      - run: yamllint --strict .

  # The parts of the RF driver that do not need ESPHome run on the build machine.
  rf-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run
        working-directory: esphome-broadlink-rm4-remote-firmware/components/bl3361
        run: |
          g++ -std=c++20 -I. -Wall -Wextra -Werror -o /tmp/test_bl3361 test/test_bl3361.cpp
          /tmp/test_bl3361
          g++ -std=c++20 -I. -Wall -Wextra -Werror -o /tmp/test_sweep test/test_sweep.cpp
          /tmp/test_sweep

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release each device supports, and whatever is current. The
        # radio of the RM4 Pro needs ESPHome 2026.10 (radio_frequency entity), the
        # rest builds with 2026.9.
        include:
          - {esphome: "2026.9.0", config: ci-rm4-mini}
          - {esphome: "latest", config: ci-rm4-mini}
          - {esphome: "2026.9.0", config: ci-rm4-mini-mac}
          - {esphome: "latest", config: ci-rm4-mini-mac}
          - {esphome: "2026.9.0", config: ci-rm4-pro-ir}
          - {esphome: "latest", config: ci-rm4-pro-ir}
          - {esphome: "2026.10.0", config: ci-rm4-pro}
          - {esphome: "latest", config: ci-rm4-pro}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.13"
      # The Python environment inside ~/.platformio points at the interpreter that
      # created it, so a cache must never outlive the runner's Python release.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ steps.python.outputs.python-version }}-${{ matrix.esphome }}-${{ hashFiles('esphome-broadlink-rm4-remote-firmware/platform/**', 'esphome-broadlink-rm4-remote-firmware/common/**', 'esphome-broadlink-rm4-remote-firmware/features/**', 'esphome-broadlink-rm4-remote-firmware/devices/**/*.yaml') }}
          restore-keys: platformio-${{ steps.python.outputs.python-version }}-${{ matrix.esphome }}-
      - name: Install ESPHome ${{ matrix.esphome }}
        run: |
          if [ "${{ matrix.esphome }}" = "latest" ]; then
            pip install esphome
          else
            pip install "esphome==${{ matrix.esphome }}"
          fi
      - name: Create throwaway secrets
        run: |
          echo "api_encryption_key: \"$(openssl rand -base64 32)\"" > .github/tests/secrets.yaml
      - name: Validate config
        run: bash .github/tests/run_logged.sh esphome -s firmware_url "$FIRMWARE_URL" -s firmware_ref "$FIRMWARE_REF" config .github/tests/${{ matrix.config }}.yaml
      - name: Compile firmware
        run: bash .github/tests/run_logged.sh esphome -s firmware_url "$FIRMWARE_URL" -s firmware_ref "$FIRMWARE_REF" compile .github/tests/${{ matrix.config }}.yaml
      - name: Check IR receiver fix
        run: bash .github/tests/check_receiver_fix.sh .github/tests/.esphome/build

  # Checks that every device file resolves when it is pulled in as a remote
  # package at this very commit, which is how users include it, the paths of the
  # earlier releases among them. The RM4 Pro is compiled as well: that exercises
  # the include paths and the component download the way they work outside of a
  # clone.
  remote-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: rm4-mini
            files: esphome-broadlink-rm4-remote-firmware/devices/rm4/mini.yaml
            compile: false
          - device: rm4-pro
            files: esphome-broadlink-rm4-remote-firmware/devices/rm4/pro.yaml
            compile: true
          # The radio left out by a substitution: infrared only.
          - device: rm4-pro-rf-none
            files: esphome-broadlink-rm4-remote-firmware/devices/rm4/pro.yaml
            compile: false
            rf: none
          # Configs written for release 1.2.0 use this file for the same.
          - device: rm4-pro-ir
            files: esphome-broadlink-rm4-remote-firmware/devices/rm4/pro-ir.yaml
            compile: false
          # Configs written for release 1.0.0 include this file.
          - device: rm4-mini-v1-shim
            files: broadlink-rm4-mini.yaml
            compile: false
          # Configs written for release 1.1.0 use these paths; the radio file of
          # the old folder is still listed next to the device file there.
          - device: rm4-mini-old-path
            files: esphome-broadlink-rm4-remote-firmware/devices/rm4-mini/rm4-mini.yaml
            compile: false
          - device: rm4-pro-old-path
            files: "esphome-broadlink-rm4-remote-firmware/devices/rm4-pro/rm4-pro.yaml, esphome-broadlink-rm4-remote-firmware/devices/rm4-pro/rf.yaml"
            compile: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Create throwaway secrets
        run: |
          echo "api_encryption_key: \"$(openssl rand -base64 32)\"" > .github/tests/secrets.yaml
      - name: Render test config
        run: |
          sed -e "s|__REPO__|$FIRMWARE_URL|g" \
              -e "s|__REF__|$FIRMWARE_REF|g" \
              -e "s|__DEVICE__|${{ matrix.device }}|g" \
              -e "s|__FILES__|${{ matrix.files }}|g" \
              -e "s|# __RF_LINE__|${{ matrix.rf && format('rf_driver: {0}', matrix.rf) || '' }}|g" \
              .github/tests/ci-remote.yaml > .github/tests/ci-remote-rendered.yaml
      - name: Validate config
        run: bash .github/tests/run_logged.sh esphome config .github/tests/ci-remote-rendered.yaml
      - name: Compile firmware
        if: matrix.compile
        run: |
          bash .github/tests/run_logged.sh esphome compile .github/tests/ci-remote-rendered.yaml
          bash .github/tests/check_receiver_fix.sh .github/tests/.esphome/build
