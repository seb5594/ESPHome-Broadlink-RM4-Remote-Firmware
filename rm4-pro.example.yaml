# Device config for the ESPHome dashboard (or the ESPHome CLI).
#
# Copy this file into your ESPHome folder, adjust the substitutions and
# put the secrets into your secrets.yaml (see secrets.yaml.example).
# All hardware settings are pulled from the GitHub repository.
#
# The RM4 Pro has infrared and a 433 MHz radio, and pro.yaml brings both: there
# is no second file to add. The radio is EXPERIMENTAL, see docs/433mhz.md. It
# needs ESPHome 2026.10 or newer. For an infrared-only device, or an older
# ESPHome, uncomment `rf_driver: none` below.

substitutions:
  name: broadlink-rm4-pro
  friendly_name: Broadlink RM4 Pro
  # Raise to 80ms if long air conditioner codes arrive split up.
  # ir_receiver_idle: 25ms
  # The RM4 Pro without the radio: infrared only, and no ESPHome 2026.10 needed.
  # rf_driver: none
  # Only if the router shows 00:e0:4c:b7:23:00 for the device: its real MAC
  # address from the label or the Broadlink app, twelve hex digits.
  # mac_address: "aabbccddeeff"

  # The branch or tag of this repository that provides the firmware parts. The
  # radio component is loaded from it as well, so keep it in sync with `ref`.
  firmware_ref: main
  # The frequency of the radio at the very first start. After that the last one
  # chosen in Home Assistant is kept, see docs/433mhz.md.
  # rf_frequency: 433.92MHz

packages:
  broadlink_rm4_pro:
    url: https://github.com/seb5594/ESPHome-Broadlink-RM4-Remote-Firmware
    ref: ${firmware_ref}
    files: [esphome-broadlink-rm4-remote-firmware/devices/rm4/pro.yaml]
    refresh: 1d
  # Working from a local clone instead? Use this line in place of the block above:
  # broadlink_rm4_pro: !include esphome-broadlink-rm4-remote-firmware/devices/rm4/pro.yaml

# Your own frequencies for the RF Frequency choice in Home Assistant. Without
# this it offers 315 MHz and 433.92 MHz.
# bl3361:
#   frequency_select:
#     options: [315MHz, 433.92MHz, 433.42MHz]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: DNS suffix of your network, e.g. ".iot.lan" (default ".local")
  # domain: !secret wifi_domain
  ap:
    password: !secret fallback_ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  # Encrypts OTA updates with the API key above, no extra password needed.
  - id: !extend ota_esphome
    encryption:
